name: Indexer full backfill evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/indexer/**"
      - ".github/workflows/indexer-backfill.yml"

permissions:
  contents: read

concurrency:
  group: indexer-full-backfill-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trnd
          POSTGRES_PASSWORD: trnd
          POSTGRES_DB: trnd_backfill
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trnd -d trnd_backfill"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://trnd:trnd@localhost:5432/trnd_backfill
      RPC_URL: https://rpc.testnet.chain.robinhood.com
      CHAIN_ID: 46630
      START_BLOCK: 114104980
      CONFIRMATIONS: 4
      BLOCK_BATCH_SIZE: 1000
      RPC_RETRY_COUNT: 5
      RPC_RETRY_DELAY_MS: 2000
      RPC_MAX_BACKOFF_MS: 60000
      BACKFILL_MAX_ATTEMPTS: 20
      BACKFILL_RETRY_DELAY_MS: 10000
      KEEPER_ENABLED: "false"
      BACKFILL_REPORT_PATH: backfill-report.json
      RECONCILIATION_REPORT_PATH: reconciliation-report.json
    defaults:
      run:
        working-directory: apps/indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run migrate
      - run: npm run backfill
      - run: npm run reconcile
      - name: Assert reconciliation passed
        run: node -e "const r=require('./reconciliation-report.json'); if(r.chainId!==46630 || !(r.launches>0) || !r.cursorBlockHash) { console.error(r); process.exit(1) }"
      - uses: actions/upload-artifact@v4
        with:
          name: robinhood-testnet-backfill-evidence
          path: |
            apps/indexer/backfill-report.json
            apps/indexer/reconciliation-report.json
          if-no-files-found: error

