name: Indexer checks

on:
  push:
    branches: [main]
    paths: ["apps/indexer/**", ".github/workflows/indexer.yml"]
  pull_request:
    paths: ["apps/indexer/**", ".github/workflows/indexer.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --check src/indexer.js
      - run: node --check src/api.js
