name: Indexer checks

on:
  push:
    branches: [main]
    paths: ["apps/indexer/**", ".github/workflows/indexer.yml"]
  pull_request:
    paths: ["apps/indexer/**", ".github/workflows/indexer.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: viral
          POSTGRES_PASSWORD: viral
          POSTGRES_DB: viral_terminal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U viral -d viral_terminal_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://viral:viral@localhost:5432/viral_terminal_test
    defaults:
      run:
        working-directory: apps/indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run migrate
      - run: for file in src/*.js test/*.js; do node --check "$file"; done
