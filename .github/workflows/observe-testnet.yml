name: Observe Robinhood testnet deployment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  observe:
    if: contains(github.event.head_commit.message, '[observe-testnet]')
    runs-on: ubuntu-latest
    env:
      RPC_URL: https://rpc.testnet.chain.robinhood.com
      DEPLOYER: "0x66B6c5e00B1242B9681BCB3bC3bCc3C87C138CaE"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Wait for and inspect support deployment
        shell: bash
        run: |
          set -euo pipefail

          nonce=0
          for attempt in $(seq 1 20); do
            nonce=$(cast nonce --rpc-url "$RPC_URL" "$DEPLOYER")
            echo "Observation $attempt: deployer nonce is $nonce"
            if [ "$nonce" -ge 5 ]; then
              break
            fi
            sleep 15
          done

          balance_wei=$(cast balance --rpc-url "$RPC_URL" "$DEPLOYER")
          mkdir -p contracts/deployments/46630
          jq -n \
            --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg deployer "$DEPLOYER" \
            --argjson nonce "$nonce" \
            --arg balanceWei "$balance_wei" \
            '{
              chainId: 46630,
              network: "Robinhood Chain Testnet",
              observedAt: $observedAt,
              deployer: $deployer,
              deployerNonce: $nonce,
              deployerBalanceWei: $balanceWei,
              supportTransactionsObserved: ($nonce >= 5)
            }' > contracts/deployments/46630/status.json

          jq . contracts/deployments/46630/status.json

      - name: Commit observation
        run: |
          git config user.name "viral-terminal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add contracts/deployments/46630/status.json
          git commit -m "chore: record Robinhood testnet deployment status"
          git push
