name: Deploy Robinhood testnet support

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-support]')) ||
      (github.event_name == 'pull_request' && github.head_ref == 'ops/testnet-support-deploy' &&
      contains(github.event.pull_request.title, '[deploy-support]'))
    runs-on: ubuntu-latest
    concurrency:
      group: viral-robinhood-testnet-support
      cancel-in-progress: false
    defaults:
      run:
        working-directory: contracts
    env:
      RH_TESTNET_RPC_URL: https://rpc.testnet.chain.robinhood.com
      RH_TESTNET_DEPLOYER_ADDRESS: "0x66B6c5e00B1242B9681BCB3bC3bCc3C87C138CaE"
      RH_TESTNET_DEPLOYER_PRIVATE_KEY: ${{ secrets.RH_TESTNET_DEPLOYER_PRIVATE_KEY }}
      EXPLORER_API_URL: https://explorer.testnet.chain.robinhood.com/api/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Validate deployment prerequisites
        run: bash testnet-preflight.sh

      - name: Build and test support deployment
        run: |
          forge build
          forge test --no-match-path "test/fork/*"

      - name: Deploy and verify support contracts
        env:
          PRIVATE_KEY: ${{ secrets.RH_TESTNET_DEPLOYER_PRIVATE_KEY }}
        run: |
          forge script script/DeployTestnetSupport.s.sol:DeployTestnetSupport \
            --rpc-url "$RH_TESTNET_RPC_URL" \
            --broadcast \
            --verify \
            --verifier blockscout \
            --verifier-url "$EXPLORER_API_URL" \
            -vvvv

      - name: Create deployment manifest
        if: success()
        run: |
          mkdir -p deployments/46630
          jq \
            --arg chainId "46630" \
            --arg deployer "$RH_TESTNET_DEPLOYER_ADDRESS" \
            '{
              chainId: ($chainId | tonumber),
              network: "Robinhood Chain Testnet",
              deployer: $deployer,
              contracts: [
                .transactions[]
                | select(.transactionType == "CREATE")
                | {
                    name: .contractName,
                    address: .contractAddress,
                    transactionHash: .hash
                  }
              ]
            }' \
            broadcast/DeployTestnetSupport.s.sol/46630/run-latest.json \
            > deployments/46630/support.json
          jq . deployments/46630/support.json

      - name: Upload broadcast and deployment manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robinhood-testnet-support-${{ github.run_number }}
          path: |
            contracts/broadcast/DeployTestnetSupport.s.sol/46630/
            contracts/deployments/46630/support.json
          if-no-files-found: warn
