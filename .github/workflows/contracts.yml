name: Protocol checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Build
        run: forge build --sizes

      - name: Unit tests
        run: forge test --no-match-path "test/fork/*"

      - name: Robinhood testnet preflight
        if: github.event_name != 'pull_request'
        env:
          RH_TESTNET_DEPLOYER_PRIVATE_KEY: ${{ secrets.RH_TESTNET_DEPLOYER_PRIVATE_KEY }}
          RH_TESTNET_DEPLOYER_ADDRESS: "0x66B6c5e00B1242B9681BCB3bC3bCc3C87C138CaE"
          RH_TESTNET_RPC_URL: ${{ secrets.RH_TESTNET_RPC_URL }}
        run: |
          if [ -z "$RH_TESTNET_DEPLOYER_PRIVATE_KEY" ]; then
            echo "Testnet deployer secret is not configured; skipping network preflight."
            exit 0
          fi
          if [ -z "$RH_TESTNET_RPC_URL" ]; then
            export RH_TESTNET_RPC_URL="https://rpc.testnet.chain.robinhood.com"
          fi
          bash testnet-preflight.sh

