services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: viral
      POSTGRES_PASSWORD: viral
      POSTGRES_DB: viral_terminal
    ports:
      - "5432:5432"
    volumes:
      - viral_indexer_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viral -d viral_terminal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  viral_indexer_data:
